<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面共有を見る</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="join" class="join">
  <form id="joinForm" class="join-box">
    <label for="name">表示名</label>
    <input id="name" maxlength="24" autocomplete="nickname" required>
    <button type="submit" class="primary">参加する</button>
    <p class="hint">あなたのカーソルが色付きで他の参加者に表示されます。相手のPCを操作することはありません。<br>映像の上で右クリックしたままドラッグすると、数秒で消える線を描けます。<br>参加後に「マイクを使う」を押すと、声でも話せます。</p>
  </form>
</div>

<header class="bar">
  <span id="status" class="status">接続中…</span>
  <ul id="people" class="people"></ul>
  <span class="spacer"></span>
  <div class="voice-ctl">
    <div class="mic-group">
      <button id="micBtn" type="button" class="mic" aria-pressed="false" title="マイクのオン/ミュート（V）"></button>
      <button id="micMenuBtn" type="button" class="more" aria-expanded="false" title="マイクの選択" hidden>▾</button>
      <div id="micMenu" class="pop" hidden></div>
    </div>
    <span id="micMeter" class="meter" title="自分のマイクの音量" hidden><i></i></span>
    <label class="vol-label" title="他の参加者の声の音量">声<input id="voiceVol" type="range" min="0" max="1" step="0.05" value="1" aria-label="他の参加者の声の音量"></label>
  </div>
  <div class="volume">
    <button id="muteBtn" type="button" aria-pressed="false" title="共有音のオン/オフ（M）">🔇 共有音オフ</button>
    <span id="rxMeter" class="meter" title="受信中の共有音のレベル"><i></i></span>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="共有音の音量" title="共有音の音量">
  </div>
  <button id="chatBtn" type="button" aria-pressed="true">チャット<span id="unread" class="badge" hidden></span></button>
  <button id="fsBtn" type="button">全画面</button>
</header>

<div id="main" class="main">
  <main id="stage" class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="layer" class="layer"></div>
    <div id="reactions" class="react-dock" role="group" aria-label="リアクション（キー1〜6）" title="右クリックしたままドラッグで、数秒で消える線を描けます" hidden></div>
    <p id="empty" class="empty">ホストが画面共有を始めると、ここに表示されます<br>（共有の前でも、マイクを使って話せます）</p>
    <p id="notice" class="notice" role="status" hidden></p>
  </main>
  <aside id="chat" class="chat">
    <ul id="chatList" class="chat-list"></ul>
    <form id="chatForm" class="chat-form">
      <textarea id="chatInput" rows="2" maxlength="300" placeholder="メッセージ（Enterで送信）"></textarea>
    </form>
  </aside>
</div>

<!-- 他の参加者の声（共有音とは別に鳴らす） -->
<audio id="voiceAudio" autoplay></audio>

<script type="module" src="/view.js"></script>
</body>
</html>
