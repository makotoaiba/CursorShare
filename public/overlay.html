<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>CursorShare overlay</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { background: transparent !important; overflow: hidden; }
  body { display: block; }
  #layer { position: fixed; inset: 0; }
  .cursor svg { width: 28px; height: 33px; } /* デスクトップ上では少し大きく */
  .cursor-name { left: 20px; top: 26px; font-size: 13px; }
  .cursor-say { left: 20px; top: 50px; }
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { max-width: 360px; padding: 8px 12px; border-radius: 8px; background: rgba(32, 36, 43, .92); color: #e7e9ec; font-size: 14px; line-height: 1.5; border-left: 4px solid var(--c); box-shadow: 0 4px 14px rgba(0, 0, 0, .35); white-space: pre-wrap; word-break: break-word; animation: toast 7s ease forwards; }
  .toast b { display: block; font-size: 12px; color: var(--c); filter: brightness(1.4); }
  @keyframes toast { 0% { opacity: 0; transform: translateY(8px); } 5%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
</style>
</head>
<body>
<div id="layer" class="layer"></div>
<div id="toasts" class="toasts"></div>
<script type="module" src="/overlay.js"></script>
</body>
</html>
