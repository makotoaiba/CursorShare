<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面共有（ホスト）</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <button id="shareBtn" type="button" class="primary">画面共有を開始</button>
  <span id="status" class="status">サーバーに接続中…</span>
  <ul id="people" class="people"></ul>
  <span id="audioBox" class="audio-box" hidden title="送信中の音声レベル"><span>音声</span><span id="audioMeter" class="meter"><i></i></span></span>
  <span id="audioHint" class="warn" hidden></span>
  <span class="spacer"></span>
  <button id="overlayBtn" type="button" aria-pressed="true" hidden title="参加者のカーソルをこのPCのデスクトップに重ねて表示">デスクトップ表示：オン</button>
  <button id="tunnelBtn" type="button" aria-pressed="false">インターネット公開：オフ</button>
  <div id="urls" class="urls"></div>
  <button id="chatBtn" type="button" aria-pressed="true">チャット<span id="unread" class="badge" hidden></span></button>
</header>

<div id="main" class="main">
  <main class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div id="layer" class="layer"></div>
    <p id="empty" class="empty">「画面共有を開始」で共有する画面を選んでください。<br>参加者のカーソル・リアクションはこのプレビューに表示されます。<br>このウィンドウ自体は、共有しない別モニターに置くと映像が入れ子になりません。</p>
  </main>
  <aside class="chat">
    <ul id="chatList" class="chat-list"></ul>
    <form id="chatForm" class="chat-form">
      <textarea id="chatInput" rows="2" maxlength="300" placeholder="メッセージ（Enterで送信）"></textarea>
    </form>
  </aside>
</div>

<dialog id="picker" class="picker">
  <form method="dialog">
    <h2>共有する画面と音声を選択</h2>
    <h3>画面全体</h3>
    <div id="pickScreens" class="pick-grid"></div>
    <h3>ウィンドウ <small>（参加者のカーソルはデスクトップには出ず、このアプリ内のプレビューに表示されます）</small></h3>
    <div id="pickWindows" class="pick-grid"></div>
    <h3>音声 <small>（共有したい音を鳴らしてみてください。音を拾えたものが自動で選ばれます）</small></h3>
    <div id="audioList" class="audio-list" role="radiogroup" aria-label="共有する音声"></div>
    <p id="audioNote" class="audio-note"></p>
    <div class="pick-foot">
      <span class="spacer"></span>
      <button value="cancel">キャンセル</button>
    </div>
  </form>
</dialog>

<script type="module" src="/host.js"></script>
</body>
</html>
